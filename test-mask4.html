<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .container { position: relative; width: 600px; height: 400px; cursor: crosshair; }
  .base, .colored { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
  <div class="container" id="cont">
    <img src="https://images.unsplash.com/photo-1544717302-de2939b7ef71?q=80&w=800" class="base" style="filter: grayscale(100%);" />
    <img src="https://images.unsplash.com/photo-1544717302-de2939b7ef71?q=80&w=800" class="colored" id="colored" />
  </div>
  <script>
    const cont = document.getElementById('cont');
    const colored = document.getElementById('colored');
    cont.addEventListener('mousemove', (e) => {
      const rect = cont.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const svg = `<svg width="${rect.width}" height="${rect.height}" xmlns="http://www.w3.org/2000/svg"><defs><filter id="f"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="40"/><feGaussianBlur stdDeviation="3"/><feComponentTransfer><feFuncA type="linear" slope="5" intercept="-2"/></feComponentTransfer></filter></defs><rect width="100%" height="100%" fill="white"/><circle cx="${x}" cy="${y}" r="150" fill="black" filter="url(#f)"/></svg>`;
      
      const encoded = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
      colored.style.webkitMaskImage = `url("${encoded}")`;
      colored.style.maskImage = `url("${encoded}")`;
    });
  </script>
</body>
</html>
