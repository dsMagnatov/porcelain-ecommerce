<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .container { position: relative; width: 600px; height: 400px; cursor: crosshair; }
  .spacer { width: 100%; height: auto; visibility: hidden; }
</style>
</head>
<body>
  <div class="container" id="cont">
    <!-- spacer to give height -->
    <img src="https://images.unsplash.com/photo-1544717302-de2939b7ef71?q=80&w=800" class="spacer" />
    
    <svg id="svgElem" style="position:absolute; top:0; left:0; width:100%; height:100%;">
      <defs>
        <filter id="brushFilter" x="-50%" y="-50%" width="200%" height="200%">
          <!-- Lower frequency = bigger shapes/irregularities. High scale = stretches them out -->
          <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="180" xChannelSelector="R" yChannelSelector="G" />
          <feGaussianBlur stdDeviation="3" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="15" intercept="-6" />
          </feComponentTransfer>
        </filter>
        <mask id="brushMask">
          <rect width="100%" height="100%" fill="white" />
          <circle id="maskCircle" cx="-500" cy="-500" r="80" fill="black" filter="url(#brushFilter)" style="transition: r 0.3s ease-out;" />
        </mask>
      </defs>
      
      <image href="https://images.unsplash.com/photo-1544717302-de2939b7ef71?q=80&w=800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" filter="grayscale(100%)" />
      <image href="https://images.unsplash.com/photo-1544717302-de2939b7ef71?q=80&w=800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" mask="url(#brushMask)" />
    </svg>
  </div>
  <script>
    const cont = document.getElementById('cont');
    const circle = document.getElementById('maskCircle');
    cont.addEventListener('mousemove', (e) => {
      const rect = cont.getBoundingClientRect();
      circle.setAttribute('cx', e.clientX - rect.left);
      circle.setAttribute('cy', e.clientY - rect.top);
    });
    cont.addEventListener('mouseenter', () => circle.setAttribute('r', '90'));
    cont.addEventListener('mouseleave', () => circle.setAttribute('r', '0'));
  </script>
</body>
</html>
